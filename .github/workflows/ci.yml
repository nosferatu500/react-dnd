name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current LTS.
        node-version: ['20.19', '24.x']

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Typecheck (TypeScript 6)
        run: npm run check:types

      - name: Validate published exports (attw)
        run: npm run check:exports

      - name: Test
        run: npm run test:coverage

      - name: React 17/18/19 conformance matrix
        run: npm run test:matrix

      - name: Verify built ESM + CJS entrypoints load
        run: npm run test:modules

      - name: Spellcheck docs
        run: npm run spellcheck

      - name: Fail if the build dirtied the tree
        run: git diff --exit-code

      - name: Publish coverage to codecov.io
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The main suite runs on whatever React is installed, so covering React 18
  # end-to-end (through @testing-library/react, not just the compat harness)
  # requires a real install swap. Vitest aliases cannot do it: RTL resolves its
  # own react-dom/client via Node and would load a second React copy.
  react-install-matrix:
    name: Full suite on React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Install React ${{ matrix.react }}
        run: |
          npm install --no-save --workspace-root \
            react@${{ matrix.react }} react-dom@${{ matrix.react }}
          node -e "console.log('react', require('react/package.json').version)"

      - run: npm run build

      - run: npm test
